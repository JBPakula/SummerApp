<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wakacje Stada</title>
  
  <!-- Manifest PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8B0000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wakacje Stada">
  
  <!-- Ikony -->
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="appFrame" src="" allow="geolocation; camera; microphone"></iframe>

  <script>
    // Bazowy adres Twojej aplikacji Streamlit
    const baseStreamlitUrl = "https://wakacje-stada.streamlit.app/";
    
    // Przekazanie parametrów (np. ?user=Asia&token=...) z paska adresu do Streamlita
    const currentParams = window.location.search;
    const targetUrl = baseStreamlitUrl + currentParams;
    
    document.getElementById("appFrame").src = targetUrl;
  </script>
</body>
</html>
